<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1a73e8" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="ManajemenX" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icon.svg" />
  <title>Manajemen X — Dashboard Keuangan</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: #1a73e8; --primary-dark: #1557b0;
      --success: #0f9d58; --danger: #db4437;
      --warning: #f4b400; --purple: #9334e6;
      --bg: #f5f7fa; --card: #ffffff;
      --border: #e4e7eb; --text: #1f2937; --muted: #6b7280;
      --sidebar-w: 240px; --header-h: 56px;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg); color: var(--text);
      -webkit-font-smoothing: antialiased;
      padding-bottom: env(safe-area-inset-bottom);
    }
    .app { display: flex; min-height: 100vh; }
    .sidebar {
      width: var(--sidebar-w); background: var(--card);
      border-right: 1px solid var(--border);
      position: fixed; top: 0; bottom: 0; left: 0;
      overflow-y: auto; z-index: 40;
      transform: translateX(-100%);
      transition: transform .25s ease;
    }
    .sidebar.open { transform: translateX(0); }
    @media (min-width: 900px) {
      .sidebar { transform: translateX(0); }
      .main { margin-left: var(--sidebar-w); }
      .menu-btn { display: none; }
    }
    .sidebar h1 {
      font-size: 18px; font-weight: 700;
      padding: 18px 20px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 10px;
    }
    .sidebar nav { padding: 10px; }
    .sidebar nav a {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 14px; border-radius: 8px;
      color: var(--text); text-decoration: none;
      font-size: 14px; margin-bottom: 2px;
      transition: background .15s;
    }
    .sidebar nav a:hover { background: #f0f4f8; }
    .sidebar nav a.active { background: #e8f0fe; color: var(--primary); font-weight: 600; }
    .nav-section {
      font-size: 11px; color: var(--muted);
      padding: 12px 14px 4px;
      text-transform: uppercase; letter-spacing: .05em;
      font-weight: 600;
    }
    .main { flex: 1; min-width: 0; }
    .topbar {
      height: var(--header-h); background: var(--card);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; padding: 0 16px; gap: 12px;
      position: sticky; top: 0; z-index: 30;
    }
    .menu-btn { background: none; border: none; font-size: 22px; cursor: pointer; padding: 6px; }
    .topbar h2 { font-size: 16px; font-weight: 600; flex: 1; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; }
    .status-dot.online { background: var(--success); }
    .status-dot.offline { background: var(--danger); }
    .content { padding: 20px; max-width: 1200px; margin: 0 auto; }
    .grid { display: grid; gap: 16px; }
    .grid-2 { grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
    .grid-3 { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
    .card {
      background: var(--card); border-radius: 12px;
      border: 1px solid var(--border); padding: 18px;
      box-shadow: 0 1px 2px rgba(0,0,0,.03);
    }
    .card h3 { font-size: 14px; font-weight: 600; margin-bottom: 12px; }
    .kpi { background: var(--card); border-radius: 12px; border: 1px solid var(--border); padding: 16px; }
    .kpi .label { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    .kpi .value { font-size: 20px; font-weight: 700; }
    .kpi.green .value { color: var(--success); }
    .kpi.red .value { color: var(--danger); }
    .kpi.blue .value { color: var(--primary); }
    .kpi.orange .value { color: var(--warning); }
    .kpi.purple .value { color: var(--purple); }
    form .field { margin-bottom: 14px; }
    form label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 4px; }
    form input, form select, form textarea {
      width: 100%; padding: 10px 12px;
      border: 1px solid var(--border); border-radius: 8px;
      font-size: 14px; background: #fff; color: var(--text);
      transition: border-color .15s; font-family: inherit;
    }
    form input:focus, form select:focus, form textarea:focus {
      outline: none; border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(26,115,232,.1);
    }
    form input[readonly] { background: #f5f7fa; cursor: not-allowed; font-weight: 600; }
    form .error { color: var(--danger); font-size: 12px; margin-top: 3px; }
    .btn {
      padding: 10px 18px; border-radius: 8px; border: none;
      font-size: 14px; font-weight: 600; cursor: pointer;
      transition: opacity .15s, background .15s; font-family: inherit;
    }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover:not(:disabled) { background: var(--primary-dark); }
    .btn-secondary { background: #f0f4f8; color: var(--text); }
    .btn-secondary:hover:not(:disabled) { background: #e4e7eb; }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-block { width: 100%; }
    .table-wrap { overflow-x: auto; border-radius: 12px; border: 1px solid var(--border); }
    table { width: 100%; border-collapse: collapse; background: #fff; font-size: 13px; }
    th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); }
    th {
      background: #f9fafb; font-weight: 600; font-size: 12px;
      color: var(--muted); text-transform: uppercase; letter-spacing: .03em;
    }
    tr:last-child td { border-bottom: none; }
    .toast {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: #1f2937; color: #fff; padding: 12px 20px;
      border-radius: 8px; font-size: 14px; z-index: 100;
      opacity: 0; transition: opacity .25s; pointer-events: none; max-width: 90vw;
    }
    .toast.show { opacity: 1; }
    .loading {
      display: flex; align-items: center; justify-content: center;
      padding: 60px 20px; color: var(--muted); font-size: 14px;
    }
    .spinner {
      width: 20px; height: 20px; border: 2px solid var(--border);
      border-top-color: var(--primary); border-radius: 50%;
      animation: spin .7s linear infinite; margin-right: 10px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .hidden { display: none !important; }
    .backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,.4);
      z-index: 35; opacity: 0; pointer-events: none; transition: opacity .25s;
    }
    .backdrop.show { opacity: 1; pointer-events: auto; }
    @media (min-width: 900px) { .backdrop { display: none; } }
    .text-muted { color: var(--muted); }
    .text-right { text-align: right; }
    .text-center { text-align: center; }
    .mt-2 { margin-top: 8px; }
    .mt-4 { margin-top: 16px; }
    .mb-2 { margin-bottom: 8px; }
    .mb-4 { margin-bottom: 16px; }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <h1>🏦 ManajemenX</h1>
      <nav id="nav">
        <a href="#/dashboard" data-route="dashboard">📊 Dashboard</a>

        <div class="nav-section">Transaksi</div>
        <a href="#/pembayaran" data-route="pembayaran">💸 Pembayaran</a>
        <a href="#/penerimaan" data-route="penerimaan">💰 Penerimaan</a>
        <a href="#/pecah-dompet" data-route="pecah-dompet">🔄 Pecah Dompet</a>

        <div class="nav-section">Faktur</div>
        <a href="#/faktur-pembelian" data-route="faktur-pembelian">🧾 Faktur Pembelian</a>
        <a href="#/faktur-penjualan" data-route="faktur-penjualan">🧾 Faktur Penjualan</a>

        <div class="nav-section">Operasional</div>
        <a href="#/purchase-request" data-route="purchase-request">📝 Purchase Request</a>
        <a href="#/inventory" data-route="inventory">📦 Inventory</a>
        <a href="#/working-order" data-route="working-order">🛠️ Working Order</a>

        <div class="nav-section">Akuntansi</div>
        <a href="#/jurnal" data-route="jurnal">📒 Jurnal</a>
        <a href="#/kaskecil" data-route="kaskecil">💵 Kas Kecil</a>

        <div class="nav-section">Master</div>
        <a href="#/akun" data-route="akun">📋 Akun (COA)</a>
        <a href="#/barang" data-route="barang">📦 Barang</a>
        <a href="#/supplier" data-route="supplier">🏭 Supplier</a>
        <a href="#/customer" data-route="customer">👥 Customer</a>
      </nav>
    </aside>
    <div class="backdrop" id="backdrop"></div>

    <div class="main">
      <header class="topbar">
        <button class="menu-btn" id="menuBtn">☰</button>
        <h2 id="pageTitle">Dashboard</h2>
        <span class="status-dot" id="statusDot" title="Status koneksi"></span>
      </header>
      <div class="content" id="view">
        <div class="loading"><div class="spinner"></div>Memuat...</div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <!-- ✅ Hanya 3 script. Modul lain di-lazy-load oleh app.js -->
  <script src="/core.js"></script>
  <script src="/import.js"></script>
  <script src="/app.js"></script>
</body>
</html>
